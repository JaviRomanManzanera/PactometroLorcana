<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorcana: probabilidades de Top</title>
<style>
:root{--bg:#fff;--fg:#1c1b22;--mut:#6a6679;--card:#f3f1f8;--bd:#d9d4e6;--ac:#5b3fd1;--g:#1a8f4c;--y:#a96a00;--r:#c53030}
@media (prefers-color-scheme:dark){:root{--bg:#15131c;--fg:#eeeaf8;--mut:#a39db8;--card:#211e2c;--bd:#352f47;--ac:#9b86ff;--g:#4cd08a;--y:#f0b44c;--r:#ff7b7b}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 4px}
textarea,input,select{width:100%;box-sizing:border-box;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
button{margin-top:12px;width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;font:600 1rem system-ui;cursor:pointer}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
details{margin-top:14px}summary{cursor:pointer;color:var(--mut)}
.w{overflow-x:auto;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:center;font-size:.88rem}
th{color:var(--mut);font-weight:600}td:first-child,th:first-child{text-align:left}
.g{color:var(--g);font-weight:700}.y{color:var(--y);font-weight:700}.r{color:var(--r);font-weight:700}
#msg{margin-top:10px;font-size:.88rem}#msg.e{color:var(--r)}.n{color:var(--mut);font-size:.8rem;margin-top:10px}
</style></head><body><main>
<h1>Probabilidades de entrar al Top</h1>

<label>URL del torneo (Ravensburger Play)</label>
<input id="url" placeholder="https://tcg.ravensburgerplay.com/events/733283">
<div class="row">
  <div><label>Top a calcular</label>
    <select id="top"><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option><option>64</option></select></div>
  <div><label>Ronda a jugar</label><select id="rnd"><option value="">(carga el torneo)</option></select></div>
  <div><label>Rondas suizas después</label><input id="rem" type="number" min="0" value="0"></div>
  <div><label>% empates</label><input id="pd" type="number" min="0" max="60" value="10"></div>
</div>
<button id="load">Cargar torneo</button>
<button id="calc" class="s" style="display:none">Recalcular con otra ronda / otro top</button>
<div id="msg"></div>

<details id="man"><summary>Si la carga automática falla: pegar datos a mano</summary>
<label>Clasificación (tabla copiada de la web, o «nombre, puntos, win%»)</label><textarea id="st"></textarea>
<label>Emparejamientos («A vs B», «X bye»)</label><textarea id="pa"></textarea>
<button id="manual" class="s">Calcular con lo pegado</button>
</details>

<div class="w" id="out"></div><p class="n" id="note"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const API='https://api.cloud.ravensburger.io/hydraproxy/api/v2';
let EV=null,ROUNDS=[],D=null;

/* ---------- carga desde la API ---------- */
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status+' en '+u);return r.json();}
const list=x=>Array.isArray(x)?x:(x&&(x.results||x.items||x.data))||[];
const pname=p=>!p?'?':(p.best_identifier||p.display_name||p.username||[p.first_name,p.last_name].filter(Boolean).join(' ')||'?');
const pct=v=>{if(v==null||v==='')return null;v=parseFloat(v);return v<=1?v*100:v;};

async function loadEvent(){
  const m=$('url').value.match(/events\/(\d+)/)||$('url').value.match(/^\s*(\d+)\s*$/);
  if(!m){msg('No encuentro el número del evento en la URL.',1);return;}
  msg('Cargando torneo…');
  try{
    EV=await j(`${API}/events/${m[1]}/`);
    ROUNDS=[];
    (EV.tournament_phases||[]).forEach((ph,pi)=>{
      const rs=(ph.rounds||[]).slice().sort((a,b)=>(a.round_number||0)-(b.round_number||0));
      rs.forEach((r,i)=>ROUNDS.push({id:r.id,phase:ph.phase_name||('Fase '+(pi+1)),left:rs.length-i-1,n:ROUNDS.length+1,status:r.status}));
    });
    if(!ROUNDS.length)throw new Error('El evento no trae rondas (¿aún sin empezar?).');
    $('rnd').innerHTML=ROUNDS.map((r,i)=>`<option value="${i}">${r.n} · ${r.phase}${r.status?' ('+r.status+')':''}</option>`).join('');
    $('rnd').value=ROUNDS.length-1;
    $('calc').style.display='block';
    await run();
  }catch(e){msg('No he podido cargar el torneo automáticamente: '+e.message+'. Usa «pegar datos a mano» (abajo).',1);$('man').open=true;}
}

async function run(){
  const k=+$('rnd').value,R=ROUNDS[k];
  $('rem').value=R.left;
  msg('Cargando clasificación y emparejamientos…');
  try{
    const mt=list(await j(`${API}/tournament-rounds/${R.id}/matches/?page_size=500`));
    let st=[];
    if(k>0)st=list(await j(`${API}/tournament-rounds/${ROUNDS[k-1].id}/standings/?page_size=500`));
    const rows=st.map(s=>({n:pname(s.player||s),p:+(s.match_points??s.points??0),g:pct(s.game_win_percentage??s.gw_percentage??s.game_win_pct)}));
    const pairs=[],byes=[];
    mt.forEach(x=>{const ps=list(x.player_match_relationships||x.players).map(r=>pname(r.player||r));
      if(ps.length==2)pairs.push(ps);else if(ps.length==1)byes.push(ps[0]);});
    pairs.forEach(pr=>pr.forEach(n=>{if(!rows.some(r=>r.n.toLowerCase()==n.toLowerCase()))rows.push({n,p:0,g:null});}));
    byes.forEach(n=>{if(!rows.some(r=>r.n.toLowerCase()==n.toLowerCase()))rows.push({n,p:0,g:null});});
    if(!rows.length)throw new Error('la API no devolvió jugadores');
    build(rows,pairs,byes);
  }catch(e){msg('Fallo al leer la ronda: '+e.message+'. Usa «pegar datos a mano».',1);$('man').open=true;}
}

/* ---------- pegado manual ---------- */
function parseStand(t){const o=[];t.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  let m=l.replace(/\t/g,' ').match(/^\d+\s+(.+?)\s+(\d+)\s+\d+-\d+-\d+\s+[\d.,]+%\s+([\d.,]+)%/);
  if(m){let n=m[1].trim();const h=n.split(/\s+/),k=h.length/2;
    if(h.length%2==0&&h.slice(0,k).join(' ')==h.slice(k).join(' '))n=h.slice(0,k).join(' ');
    o.push({n,p:+m[2],g:parseFloat(m[3].replace(',','.'))});return;}
  m=l.match(/^(.*?)[,;\t]\s*(\d+)(?:\s*[,;\t]\s*(\d+(?:[.,]\d+)?)\s*%?)?\s*$/);
  o.push(m?{n:m[1].trim(),p:+m[2],g:m[3]?parseFloat(m[3].replace(',','.')):null}:{n:l,p:0,g:null});});return o;}
function manual(){
  const rows=parseStand($('st').value);if(rows.length<2){msg('Pega la clasificación.',1);return;}
  const pairs=[],byes=[];
  $('pa').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;
    const b=l.match(/^(.*?)\s+bye$/i);if(b){byes.push(b[1].trim());return;}
    const p=l.split(/\s+vs\.?\s+|\s+-\s+/i);if(p.length==2)pairs.push([p[0].trim(),p[1].trim()]);});
  build(rows,pairs,byes);
}

/* ---------- datos -> modelo ---------- */
function build(rows,pairs,byes){
  const idx=n=>rows.findIndex(r=>r.n.toLowerCase()==String(n).trim().toLowerCase());
  const d={names:rows.map(r=>r.n),pts:rows.map(r=>r.p),wr:rows.map(r=>r.g),pairs:[],byes:[],opp:{}};
  pairs.forEach(([a,c])=>{a=idx(a);c=idx(c);if(a>=0&&c>=0){d.pairs.push([a,c]);d.opp[a]=c;d.opp[c]=a;}});
  byes.forEach(n=>{const i=idx(n);if(i>=0)d.byes.push(i);});
  D=d;calc();
}

/* ---------- simulación ---------- */
function rnd(pD,a,c,wr){const x=wr[a]??50,y=wr[c]??50,pa=(x+5)/(x+y+10),u=Math.random(),w=(1-pD)*pa;return u<w?0:u<w+pD?1:2;}
function add(P,a,c,r){if(r==0)P[a]+=3;else if(r==1){P[a]++;P[c]++;}else P[c]+=3;}
function sim(d,K,rem,pD,f){
  const P=d.pts.slice();d.byes.forEach(i=>P[i]+=3);
  d.pairs.forEach(([a,c])=>{let r;
    if(f&&f.p==a)r=f.res;else if(f&&f.p==c)r=[2,1,0][f.res];else r=rnd(pD,a,c,d.wr);add(P,a,c,r);});
  for(let k=0;k<rem;k++){
    const o=P.map((v,i)=>[v+Math.random()*.5,i]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
    for(let i=0;i+1<o.length;i+=2)add(P,o[i],o[i+1],rnd(pD,o[i],o[i+1],d.wr));
    if(o.length%2)P[o[o.length-1]]+=3;}
  const s=P.slice().sort((x,y)=>y-x),cut=s[Math.min(K,s.length)-1];
  const above=P.filter(v=>v>cut).length,tied=P.filter(v=>v==cut).length,sh=Math.max(0,Math.min(1,(K-above)/tied));
  return P.map(v=>v>cut?1:v==cut?sh:0);
}
function prob(d,K,rem,pD,f,N){const a=new Array(d.pts.length).fill(0);
  for(let i=0;i<N;i++){const r=sim(d,K,rem,pD,f);for(let j=0;j<r.length;j++)a[j]+=r[j];}return a.map(v=>v/N);}
function cell(v){const p=v*100;
  if(p>=99.5)return'<td class="g">Seguro</td>';if(p<=.5)return'<td class="r">Fuera</td>';
  return`<td class="${p>=60?'g':p>=25?'y':'r'}">${p.toFixed(0)}%</td>`;}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function calc(){
  if(!D)return;msg('Calculando…');$('out').innerHTML='';
  setTimeout(()=>{
    const d=D,K=+$('top').value,rem=Math.max(0,+$('rem').value||0),pD=Math.min(.6,Math.max(0,(+$('pd').value||0)/100)),N=1500;
    const base=prob(d,K,rem,pD,null,N*2);
    const ord=d.names.map((_,i)=>i).sort((a,b)=>d.pts[b]-d.pts[a]||base[b]-base[a]);
    let h='<table><tr><th>Jugador</th><th>Pts</th><th>GW%</th><th>Ahora</th><th>Si gana</th><th>Si empata</th><th>Si pierde</th></tr>';
    ord.forEach(i=>{
      let c='<td>—</td><td>—</td><td>—</td>';
      if(d.opp[i]!==undefined)c=[0,1,2].map(r=>cell(prob(d,K,rem,pD,{p:i,res:r},N)[i])).join('');
      else if(d.byes.includes(i))c='<td colspan="3" style="color:var(--mut)">bye (+3)</td>';
      h+=`<tr><td>${esc(d.names[i])}</td><td>${d.pts[i]}</td><td>${d.wr[i]==null?'—':d.wr[i].toFixed(0)+'%'}</td>${cell(base[i])}${c}</tr>`;});
    $('out').innerHTML=h+'</table>';msg('');
    $('note').textContent='Simulación Monte Carlo: cada partida se pondera con el GW% de los dos jugadores (50 % si falta), las rondas siguientes se emparejan por puntos y los empates en el corte se reparten a partes iguales porque no se conocen los desempates exactos.';
  },30);
}
function msg(t,e){const m=$('msg');m.textContent=t;m.className=e?'e':'';}

$('load').onclick=loadEvent;
$('calc').onclick=()=>{if(ROUNDS.length)run();};
$('manual').onclick=manual;
$('top').onchange=()=>D&&calc();
</script></body></html>
